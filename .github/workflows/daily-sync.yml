name: Daily LH Sync

# 매일 KST 00:00 (UTC 15:00) 자동 실행 + 수동 dispatch 허용.
# 신규 공고만 incremental 처리 — 이미 캐시된 매물은 모든 단계에서 skip.
on:
  schedule:
    - cron: "0 15 * * *"  # UTC 15:00 = KST 00:00
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub Actions max 360. 첫 캐시 부트스트랩 후엔 ~20분.

    permissions:
      contents: write       # 변경된 데이터 자동 commit + push

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # actions/cache 의 post-step save 는 job 성공 시에만 실행 → cancelled/timeout
      # 시 영원히 cache 안 됨. 해결: restore/save 분리 + Phase 끝나자마자 즉시 save.
      - name: Restore notice-texts cache
        uses: actions/cache/restore@v4
        with:
          path: lib/notice-texts
          key: notice-texts-v1-${{ github.run_id }}
          restore-keys: notice-texts-v1-

      - name: Restore notice-embeddings cache
        uses: actions/cache/restore@v4
        with:
          path: lib/notice-embeddings
          key: notice-embeddings-v1-${{ github.run_id }}
          restore-keys: notice-embeddings-v1-

      - name: Restore lh-complexes cache
        uses: actions/cache/restore@v4
        with:
          path: lib/lh-complexes.json
          key: lh-complexes-v1-${{ github.run_id }}
          restore-keys: lh-complexes-v1-

      - name: Phase 1 — LH 공고 list sync (data.go.kr)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          node scripts/sync-myhome-all.mjs
          node scripts/normalize-lh-notices.mjs

      - name: Phase 2 — 상세 페이지 enrich (좌표·사진·일정·noticeStatus)
        run: |
          node scripts/enrich-lh-details.mjs --resume
          node scripts/enrich-complexes.mjs

      - name: Phase 3 — 공고문 PDF → markdown (Solar Document Parse)
        env:
          SOLAR_API_KEY: ${{ secrets.SOLAR_API_KEY }}
        run: |
          node scripts/enrich-notice-text.mjs --limit 9999 --active-only
          node scripts/enrich-notice-text.mjs --limit 9999 --active-only --from-api

      # 캐시 즉시 저장 — Phase 3 가 1시간 37분 걸리는 가장 비싼 단계.
      # 이후 step 이 timeout/실패해도 이 cache 는 보존 → 다음 run 부터 hit.
      - name: Save notice-texts cache (즉시)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: lib/notice-texts
          key: notice-texts-v1-${{ github.run_id }}

      - name: Phase 3.5 — markdown 표 → supply / 임대조건 정형 추출 (regex)
        # PDF→md 의 모집세대수·보증금·월세 표를 결정론적으로 파싱 → listings-api 정정.
        # LH API 부정확 값 (supplyUnits=1 등) / null 임대조건 보강. 데이터 정합성 최우선.
        run: node scripts/extract-supply-from-md.mjs --force

      - name: Phase 4 — 임베딩 인덱스 (Solar embedding)
        env:
          SOLAR_API_KEY: ${{ secrets.SOLAR_API_KEY }}
        run: |
          node scripts/embed-notice-texts.mjs --limit 9999

      - name: Save notice-embeddings cache (즉시)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: lib/notice-embeddings
          key: notice-embeddings-v1-${{ github.run_id }}

      - name: Phase 5 — 자격 정보 구조화 추출 (Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/extract-eligibility.mjs --limit 9999

      - name: Phase 6a — cover 사진 Blob 업로드
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/upload-covers-to-blob.mjs

      # vectors.bin (550MB+) 가 Vercel Blob 의 timeout/limit 에 자주 실패.
      # 실패해도 Phase 7/commit 계속 — 옛 blob URL 사용 (기능 영향 적음, 신규 매물 검색만 일부 제한).
      - name: Phase 6b — vectors.bin Blob 업로드 (실패 허용)
        continue-on-error: true
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/upload-vectors-to-blob.mjs

      - name: Phase 7 — 최종 sync (LH 공공데이터 API + 좌표 보강)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
        run: node scripts/sync-lh-api.mjs

      # 최종 sync 로 listings-api 가 갱신된 뒤 신규 매물의 단지조감도 크롤(기존은 skip)
      # → Blob 업로드. sync-lh-api 가 기존 cover 는 보존하므로 매일 신규분만 처리.
      - name: Phase 7.5 — 단지조감도 크롤 + Blob 업로드 (신규 매물)
        continue-on-error: true
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          node scripts/enrich-photos-api.mjs
          node scripts/upload-covers-to-blob.mjs

      # 다지점 공고(여러 단지/지역)를 단지별 핀으로 지도 분리 — .md 단지목록 AI 추출 +
      # VWorld 지오코딩. 제목 사전필터로 후보만 검사(비용↓). 이미 분리된 건 skip.
      - name: Phase 7.6 — 다지점 공고 지도 분리 (AI + 지오코딩)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
        run: node scripts/extract-mapped-regional.mjs --active

      # "전국 모집"에 잘못 떨어진 단일 공고(제목에 시·군·구 명확)를 지역 단위 지도 핀으로 이동.
      # 다지점 분리(7.6) 다음에 실행 — 이미 분리된 pid 는 skip. 시/도만 넓은 광역은 잔류.
      - name: Phase 7.6b — 단일 지역 공고 지오코딩 → 지도 이동
        continue-on-error: true
        env:
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
        run: node scripts/geocode-regional-singles.mjs --active

      # 분리된 다지점 단지마다 제 조감도 크롤(없으면 비움) → Blob 업로드.
      - name: Phase 7.7 — 다지점 단지별 조감도 크롤 + Blob 업로드
        continue-on-error: true
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          node scripts/enrich-mapped-covers.mjs
          node scripts/upload-covers-to-blob.mjs

      # 활성 LH 공고의 평면도 이미지 → Claude 비전으로 3D 평면도 스펙 생성(없는 건만).
      # 최종 sync(Phase 7) 뒤라 최신 활성 매물 기준. 이미 스펙 있는 공고는 skip(비용↓).
      - name: Phase 7.8 — 평면도 3D 스펙 추출 (Claude 비전)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/extract-floorplans.ts

      # SH(서울주거포털)·청년안심주택(soco) 공고 sync — 어드민 검수 큐 공급원.
      # sync-sh 가 sh-notices.json 을 전체 재작성하므로 geocode-sh 를 바로 뒤에 실행해
      # 좌표(lat/lng) 재부여 (geocode-sh 는 매 실행 전 건 재지오코딩). 스크래핑이라 실패 허용.
      - name: Phase 8 — SH·청년안심 공고 sync
        continue-on-error: true
        env:
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
        run: |
          node scripts/sync-sh.mjs
          node scripts/geocode-sh.mjs
          node scripts/sync-youth.mjs

      # 신규 SH 메가공고(행복주택·장기전세 등 시단위) 단지별 분리 — 이미 분리된 seq 는 skip.
      - name: Phase 8.5 — SH 다지점 공고 단지 분리 (AI + 지오코딩)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          SOLAR_API_KEY: ${{ secrets.SOLAR_API_KEY }}
        run: node scripts/extract-sh-mapped.mjs

      # 검수 큐(미검수+이슈) 야간 일괄 추출 → 초안(extract-drafts.json) 커밋.
      # 검수자는 아침에 "초안 불러오기"로 대기 없이 확인·저장 (어드민 P5).
      - name: Phase 9 — 검수 큐 일괄 추출 초안
        continue-on-error: true
        env:
          SOLAR_API_KEY: ${{ secrets.SOLAR_API_KEY }}
        run: npx tsx scripts/batch-extract.ts --limit 15

      - name: Save lh-complexes cache (즉시)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: lib/lh-complexes.json
          key: lh-complexes-v1-${{ github.run_id }}

      - name: Commit & push data updates
        run: |
          git config user.name  "doongji-bot"
          git config user.email "bot@doongji.local"
          # gitignored 파일 (vectors.bin, lh-covers/) 은 자동 제외됨.
          # blob-covers.json, blob-vectors.json, listings-api.json, lh-notices-all.json 등은 commit 대상.
          git add lib/ || true
          if git diff --cached --quiet; then
            echo "No data changes — skip commit"
            exit 0
          fi
          git commit -m "data: daily sync $(date -u +%Y-%m-%dT%H:%MZ)"
          # workflow 도는 동안 다른 push 가 있을 수 있어 rebase 후 retry.
          for i in 1 2 3; do
            if git push; then
              echo "push success (attempt $i)"
              exit 0
            fi
            echo "push rejected, fetching + rebasing (attempt $i)"
            git pull --rebase origin main
          done
          echo "push failed after 3 retries"
          exit 1
