name: Daily housing data sync
on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
concurrency:
  group: daily-housing-data-sync
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore complex API cache
        uses: actions/cache/restore@v4
        with:
          path: |
            lib/lh-complexes.json
            lib/lh-complexes.json.fetched-at
          key: lh-complexes-v2-${{ github.run_id }}
          restore-keys: lh-complexes-v2-
      - name: Collect housing data with public APIs and official pages
        env:
          NODE_OPTIONS: --import ./scripts/lib/proxy-fetch.mjs
          GOV_PROXY_URL: https://public-housing-map.vercel.app/api/govproxy
          GOV_PROXY_SECRET: ${{ secrets.GOV_PROXY_SECRET }}
          GOV_PROXY_HOSTS: apis.data.go.kr,www.myhome.go.kr,data.myhome.go.kr,api.vworld.kr,apply.lh.or.kr,www.i-sh.co.kr,soco.seoul.go.kr,housing.seoul.go.kr
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: node scripts/sync-api-first.mjs --data-only
      - name: Save complex API cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            lib/lh-complexes.json
            lib/lh-complexes.json.fetched-at
          key: lh-complexes-v2-${{ github.run_id }}
      - name: Commit verified data updates
        run: |
          git config user.name 'doongji-bot'
          git config user.email 'bot@doongji.local'
          git add -u lib/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: daily sync $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
