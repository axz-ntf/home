name: API Connectivity Test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: TCP connect test to all external domains
        run: |
          for h in apis.data.go.kr www.myhome.go.kr data.myhome.go.kr apply.lh.or.kr api.vworld.kr www.i-sh.co.kr soco.seoul.go.kr housing.seoul.go.kr; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -A "Mozilla/5.0" "https://$h/" || echo FAIL)
            echo "$h -> $code"
          done
