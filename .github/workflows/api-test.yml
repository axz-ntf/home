name: API Connectivity Test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check runner egress IP and gov API reachability
        run: |
          echo "== runner IP =="; curl -s --max-time 10 https://api.ipify.org || true; echo
          echo "== apis.data.go.kr =="
          curl -sv -o /dev/null --max-time 20 "https://apis.data.go.kr/1613000/HWSPR02/rsdtRcritNtcList?serviceKey=test&numOfRows=1" 2>&1 | tail -12 || true
          echo "== www.myhome.go.kr =="
          curl -sv -o /dev/null --max-time 20 -A "Mozilla/5.0" "https://www.myhome.go.kr" 2>&1 | tail -12 || true
          echo "== control: github.com =="
          curl -s -o /dev/null -w "%{http_code}\n" --max-time 10 https://github.com || true
